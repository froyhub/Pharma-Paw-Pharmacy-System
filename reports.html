<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Inventory Reports | Pharma Paw</title>
        <link rel="stylesheet" href="assets/style.css">
        <script src="assets/app.js" defer></script>
    </head>
    <body>
        <header>
            <div class="brand">🐾 Pharma Paw Pharmacy</div>
            <div class="muted">Signed in: Admin / Storekeeper · <a href="login.html">Logout</a></div>
        </header>
        <div class="layout">
            <aside>
                <a class="" href="dashboard.html">Dashboard</a>
                <a class="" href="medicines.html">Medicine Catalogue</a>
                <a class="" href="batches.html">Batch & Expiry</a>
                <a class="" href="stock.html">Stock Transactions</a>
                <a class="" href="suppliers.html">Suppliers</a>
                <a class="" href="logs.html">Activity Logs</a>
                <a class="active" href="reports.html">Reports</a>
                <a class="" href="staff.html">Staff Accounts</a>
                <a class="" href="login.html">Login</a>
            </aside>
            <main>
                <h1>Inventory Reports</h1>
                <p class="muted">Storyboard prototype · Admin / Storekeeper view</p>
                <div class="panel form">
                    <label>Report Type</label>
                    <select>
                        <option>Current Stock Summary</option>
                        <option>Low Stock Report</option>
                        <option>Expiry / Near-Expiry Report</option>
                        <option>Stock Transaction History</option>
                        <option>Supplier Receiving Report</option>
                    </select>
                    <label>Start Date</label>
                    <input type="date">
                    <label>End Date</label>
                    <input type="date">
                    <div class="actions">
                        <button data-demo="Demo: generate a report using selected filters.">Generate Report</button>
                        <button class="btn secondary" data-demo="Demo: export the displayed report to CSV.">Export CSV</button>
                    </div>
                </div>
            </main>
        </div>
    </body>
</html>
