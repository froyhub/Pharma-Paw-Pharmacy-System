<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Reports | Pharma Paw</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/reports.css">

    <script>
    const currentRole = sessionStorage.getItem('userRole');
    if (!currentRole) {
        window.location.href = 'login.html';
    }

    document.addEventListener("DOMContentLoaded", () => {
        if (currentRole !== 'Admin') {
            const staffNavLink = document.querySelector('aside a[href="staff.html"]');
            if (staffNavLink) {
                staffNavLink.style.display = 'none'; 
            }
        }
    });
    </script>
    
</head>
<body>
    <header>
        <div class="brand">🐾 Pharma Paw</div>
        <div class="muted">Signed in: Storekeeper · <a href="login.html">Logout</a></div>
    </header>
    <div class="layout">
        <aside>
            <a href="dashboard.html">Dashboard</a>
            <a href="medicines.html">Medicine Catalogue</a>
            <a href="batches.html">Batch & Expiry</a>
            <a href="stock.html">Stock Transactions</a>
            <a href="suppliers.html">Suppliers</a>
            <a href="logs.html">Activity Logs</a>
            <a href="reports.html" class="active">Reports</a>
            <a href="staff.html">Staff Accounts</a>
        </aside>
        <main>
            <h1>Inventory Reports</h1>
            <p class="muted">Generate and export stock data.</p>
            
            <div class="panel form" style="max-width: 600px;">
                <label>Report Type</label>
                <select>
                    <option>Current Stock Summary</option>
                    <option>Low Stock Report</option>
                    <option>Expiry Report</option>
                </select>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div>
                        <label>Start Date</label>
                        <input type="date">
                    </div>
                    <div>
                        <label>End Date</label>
                        <input type="date">
                    </div>
                </div>
                
                <div class="actions" style="margin-top: 1rem;">
                    <button class="btn">Generate Report</button>
                    <button class="btn secondary">Export CSV</button>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
