<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Login | Pharma Paw</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-body">
    <div class="login-wrapper">
        
        <div class="login-left">
            <div class="login-form-container">
                <div class="brand-header">
                    <h1>🐾 Pharma Paw</h1>
                    <p class="muted">Sign in to manage your pharmacy inventory.</p>
                </div>
                
                <div class="form">
                    <label>Staff ID</label>
                    <input type="text" id="login-id" placeholder="Enter User ID (e.g. ADMIN001)">
                    
                    <label>Password</label>
                    <input type="password" id="login-pass" placeholder="Enter Password">
                    
                    <button onclick="handleLogin()" class="btn-login">Sign In</button>
                    
                    <p id="login-error" class="error-msg"></p>
                    
                    <div class="demo-credentials">
                        <p><strong>Demo Credentials:</strong></p>
                        <p>Admin: <code>ADMIN001</code> / <code>admin123</code></p>
                        <p>Staff: <code>SK001</code> / <code>staff123</code></p>
                    </div>
                </div>
            </div>
        </div>

        <div class="login-right">
            <div class="graphic-overlay">
                <h2>Smart Inventory for Animal Care.</h2>
                <p>Track medicines, monitor expiry dates, and manage stock seamlessly from one centralized platform.</p>
            </div>
        </div>

    </div>

    <script>
        function handleLogin() {
            const id = document.getElementById('login-id').value.trim().toUpperCase();
            const pass = document.getElementById('login-pass').value;
            const errorMsg = document.getElementById('login-error');
            errorMsg.style.display = 'none';

            if (id === 'ADMIN001' && pass === 'admin123') {
                sessionStorage.setItem('userRole', 'Admin');
                sessionStorage.setItem('userId', 'ADMIN001');
                window.location.href = 'staff.html'; 
            } else if (id === 'SK001' && pass === 'staff123') {
                sessionStorage.setItem('userRole', 'Storekeeper');
                sessionStorage.setItem('userId', 'SK001');
                window.location.href = 'dashboard.html';
            } else if (id === 'PAW002' && pass === 'staff123') {
                sessionStorage.setItem('userRole', 'Assistant');
                sessionStorage.setItem('userId', 'PAW002');
                window.location.href = 'dashboard.html';
            } else {
                errorMsg.innerText = 'Invalid Credentials. Please try again.';
                errorMsg.style.display = 'block';
            }
        }
    </script>
</body>
</html>
