<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Suppliers | Pharma Paw</title>
    <link rel="stylesheet" href="css/theme.css">
    
    <script>
        if (!sessionStorage.getItem('userRole')) window.location.href = 'login.html';
        document.addEventListener("DOMContentLoaded", () => {
            const role = sessionStorage.getItem('userRole');
            document.getElementById('nav-role').innerText = role;
            if (role !== 'Admin') {
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
            }
        });
        function logout() { sessionStorage.clear(); window.location.href = 'login.html'; }
    </script>
</head>
<body>
    <header>
        <div class="brand">🐾 Pharma Paw</div>
        <div class="muted">Signed in: <span id="nav-role">...</span> · <a href="#" onclick="logout()">Logout</a></div>
    </header>
    <div class="layout">
        <aside>
            <a href="dashboard.html">Dashboard</a>
            <a href="medicines.html">Medicine Catalogue</a>
            <a href="batches.html">Batch & Expiry</a>
            <a href="stock.html">Stock Transactions</a>
            <a href="suppliers.html" class="active">Suppliers</a>
            <a href="logs.html" class="admin-only">Activity Logs</a>
            <a href="reports.html" class="admin-only">Reports</a>
            <a href="staff.html" class="admin-only">Staff Accounts</a>
        </aside>
        <main>
            <h1>Suppliers</h1>
            <p class="muted">Manage your vendor contacts.</p>
            
            <div class="panel form">
                <h3>Add New Supplier</h3>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div>
                        <label>Supplier ID</label><input type="text" id="sup-id">
                        <label>Supplier Name</label><input type="text" id="sup-name">
                    </div>
                    <div>
                        <label>Phone</label><input type="text" id="sup-phone">
                        <label>Email</label><input type="email" id="sup-email">
                    </div>
                </div>
                <button onclick="addSupplier()" style="margin-top: 1rem;">Save Supplier</button>
            </div>

            <div class="panel">
                <table id="sup-table">
                    <thead>
                        <tr><th>SUPP_ID</th><th>Name</th><th>Phone</th><th>Email</th></tr>
                    </thead>
                    <tbody>
                        <tr><td>SUPP01</td><td>PawCare Veterinary Supplies</td><td>03-5555 0101</td><td>sales@pawcare.example</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        function addSupplier() {
            const id = document.getElementById('sup-id').value;
            const name = document.getElementById('sup-name').value;
            const phone = document.getElementById('sup-phone').value;
            const email = document.getElementById('sup-email').value;

            const tbody = document.querySelector('#sup-table tbody');
            tbody.innerHTML += `<tr><td>${id}</td><td>${name}</td><td>${phone}</td><td>${email}</td></tr>`;
            
            document.querySelectorAll('.form input').forEach(i => i.value = '');
        }
    </script>
</body>
</html>
