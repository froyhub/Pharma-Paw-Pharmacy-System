<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Staff Login | Pharma Paw</title>
        <link rel="stylesheet" href="assets/style.css">
        <script src="assets/app.js" defer></script>
    </head>
    <body>
        <header>
            <div class="brand">🐾 Pharma Paw Pharmacy</div>
            <div class="muted">Signed in: All roles · <a href="login.html">Logout</a></div>
        </header>
        <div class="layout">
            <aside>
                <a class="" href="dashboard.html">Dashboard</a>
                <a class="" href="medicines.html">Medicine Catalogue</a>
                <a class="" href="batches.html">Batch & Expiry</a>
                <a class="" href="stock.html">Stock Transactions</a>
                <a class="" href="suppliers.html">Suppliers</a>
                <a class="" href="logs.html">Activity Logs</a>
                <a class="" href="reports.html">Reports</a>
                <a class="" href="staff.html">Staff Accounts</a>
                <a class="active" href="login.html">Login</a>
            </aside>
            <main>
                <h1>Staff Login</h1>
                <p class="muted">Storyboard prototype · All roles view</p>
                <div class="panel form">
                    <form>
                        <label>Staff ID</label>
                        <input placeholder="e.g. PAW001">
                        <label>Password</label>
                        <input type="password" placeholder="Password">
                        <div class="actions">
                            <button type="button" data-demo="Demo: validate credentials, create a session, then redirect to the role-specific dashboard.">Login</button>
                            <a class="btn secondary" href="activate.html">Activate account</a>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </body>
</html>
